# Historia de ejemplo para las pruebas del contrato (H09). No es el guion de "Vida comercial del Metro" (H12).
# El primer panel es un estado completo; el segundo es parcial y hereda todo menos el territorio.
slug: ejemplo-mercados
titulo: Mercados con más locales de comida
exploracion: bloqueada
paneles:
  - estado:
      contrato: 1
      edicion: "2026-05"
      territorio: {tipo: alcaldia, clave: "007"}
      escena: {tipo: ciudades_dentro, modo: exterior, tamano: establecimientos_seleccion}
      seleccion: {scian: ["722"]}
      narrativa:
        titulo: "Mercados de {territorio} con más locales de comida"
        texto: "{lider} concentra {principal} establecimientos de preparación de alimentos."
        principal: {medida: establecimientos_seleccion, fila: primera, formato: entero}
        secundarias:
          - {nombre: lider, medida: nombre, fila: primera, formato: texto}
        nota_cautela: "El DENUE registra cada local como establecimiento; un puesto sin registro no aparece."
  - estado:
      territorio: {tipo: alcaldia, clave: "015"}
    exploracion: libre
