<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contenido descargado — Pulso DENUE</title>
<style>
  :root { --bg:#faf9f6; --panel:#fff; --tx:#1d1d1b; --mut:#6b6a64; --line:#e4e1d8; --acc:#b4501d; --c1:#2b6cb0; --c2:#2f855a; --c3:#9b2c2c; --map:#f3f1ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161614; --panel:#1f1f1c; --tx:#ecebe6; --mut:#9b9a92; --line:#33322d; --acc:#e08a55; --c1:#63a4e6; --c2:#5bc08a; --c3:#e57373; --map:#1a1a17; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.5 system-ui, sans-serif; }
  header { padding:20px 16px 8px; max-width:1100px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:22px; } h2 { font-size:17px; margin:22px 0 8px; } p.s { margin:0; color:var(--mut); }
  nav { display:flex; gap:4px; flex-wrap:wrap; max-width:1100px; margin:8px auto 0; padding:0 16px; border-bottom:1px solid var(--line); }
  nav button { background:none; border:0; padding:8px 12px; font:inherit; color:var(--mut); cursor:pointer; border-bottom:2px solid transparent; }
  nav button.on { color:var(--tx); border-color:var(--acc); }
  main { max-width:1100px; margin:0 auto; padding:8px 16px 40px; }
  section { display:none; } section.on { display:block; }
  table { border-collapse:collapse; width:100%; font-size:13px; background:var(--panel); }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:600; position:sticky; top:0; background:var(--panel); }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .scroll { overflow:auto; max-height:420px; border:1px solid var(--line); border-radius:6px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .card b { font-size:22px; display:block; } .card span { color:var(--mut); font-size:13px; }
  .bar { display:flex; align-items:center; gap:8px; font-size:13px; margin:2px 0; }
  .bar i { display:block; height:12px; background:var(--c1); border-radius:2px; }
  .bar .l { width:210px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar .v { color:var(--mut); font-variant-numeric:tabular-nums; }
  #mapa { width:100%; height:560px; background:var(--map); border:1px solid var(--line); border-radius:8px; cursor:grab; display:block; }
  .tog { display:flex; flex-wrap:wrap; gap:14px; margin:8px 0; font-size:13px; }
  .tog label { display:flex; gap:5px; align-items:center; cursor:pointer; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .nota { color:var(--mut); font-size:13px; margin:6px 0; } code { background:var(--line); padding:0 4px; border-radius:3px; font-size:12px; }
  #info { font-size:13px; min-height:20px; color:var(--mut); }
</style>
</head>
<body>
<header>
  <h1>Contenido descargado</h1>
  <p class="s">Vista elemental de lo que hay en <code>data/raw</code>: tablas de inventario, muestras de filas y un mapa de capas. Se lee de los archivos, no de la base.</p>
</header>
<nav id="tabs"></nav>
<main id="main"></main>

<script>
const D = /*DATOS*/null;
const fmt = n => n.toLocaleString('es-MX');
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function tabla(cols, filas, num = []) {
  return '<div class="scroll"><table><thead><tr>' + cols.map((c, i) => `<th class="${num.includes(i) ? 'n' : ''}">${esc(c)}</th>`).join('') +
    '</tr></thead><tbody>' + filas.map(f => '<tr>' + f.map((v, i) => `<td class="${num.includes(i) ? 'n' : ''}">${esc(typeof v === 'number' ? fmt(v) : v)}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>';
}
function barras(items, color) {
  const max = Math.max(...items.map(i => i[1]));
  return items.map(([l, v, t]) => `<div class="bar"><span class="l" title="${esc(t || l)}">${esc(l)}</span><i style="width:${Math.max(2, 420 * v / max)}px;${color ? 'background:' + color : ''}"></i><span class="v">${fmt(v)}</span></div>`).join('');
}
const totalDenue = D.denue.reduce((a, e) => a + e.filas, 0);
const secciones = {
  'Resumen': () => `
    <h2>Qué hay</h2>
    <div class="cards">
      <div class="card"><b>${fmt(totalDenue)}</b><span>filas del DENUE, 4 ediciones (${D.denue.map(e => e.edicion).join(', ')})</span></div>
      <div class="card"><b>${fmt(D.col_total)}</b><span>polígonos de colonia (datos abiertos CDMX)</span></div>
      <div class="card"><b>${fmt(D.mercados.length)}</b><span>mercados públicos (puntos)</span></div>
      <div class="card"><b>${fmt(D.ce_total.filas)}</b><span>filas del Censo Económico 2024 (CDMX)</span></div>
      <div class="card"><b>${fmt(D.osm.ways)}</b><span>calles de OpenStreetMap (${D.osm.mosaicos} de 16 mosaicos)</span></div>
    </div>
    <h2>Inventario</h2>
    ${tabla(['Fuente', 'Archivo(s)', 'Contenido', 'Tamaño (MB)'], [
      ['DENUE (INEGI)', 'anterior/*, vigente/', `4 ediciones de CDMX, 42 columnas, ISO-8859-1`, D.denue.reduce((a, e) => a + e.mb, 0)],
      ['Colonias (datos abiertos CDMX)', 'externas/colonias.geojson', `${D.col_total} polígonos: colonias y pueblos y barrios originarios`, 10.4],
      ['Mercados públicos (datos abiertos CDMX)', 'externas/mercados.geojson', `${D.mercados.length} puntos con superficie, locales y tipo`, 0.2],
      ['Censos Económicos 2024 (INEGI)', 'externas/ce2024*/', `${D.ce_total.filas} filas × 107 columnas; referencia 2023; SCIAN 2023`, 4.4],
      ['Calles (OpenStreetMap, Overpass)', 'externas/osm/', `${fmt(D.osm.ways)} ways de ${D.osm.mosaicos} mosaicos`, D.osm.mb],
      ['Tablas SCIAN (INEGI)', 'externas/*.pdf', 'Comparativas SCIAN 2023-2018 y con la CIIU', ''],
    ], [3])}
    <p class="nota">Más detalle en las demás pestañas. El origen y los hashes de cada descarga están en <code>data/raw/MANIFEST.md</code>.</p>`,

  'Mapa': () => `
    <div class="tog" id="tog"></div>
    <canvas id="mapa"></canvas>
    <div id="info">Rueda para acercar, arrastrar para mover. Pasa el cursor sobre un mercado para ver su nombre.</div>
    <p class="nota">Muestra: ${fmt(D.denue_puntos.length)} puntos del DENUE 05/2026 (3,5 %), polígonos de colonia simplificados y calles de OpenStreetMap (principales completas; el resto, una muestra del 6 %).</p>`,

  'DENUE': () => `
    <h2>Ediciones</h2>
    ${tabla(['Edición', 'Publicación', 'Filas', 'Tamaño CSV (MB)'], D.denue.map(e => [e.edicion, e.publicacion, e.filas, e.mb]), [2, 3])}
    <p class="nota">En la 05/2026 hay ${D.denue[3].fuera} puntos con coordenadas fuera de CDMX (se excluyen en el modelo).</p>
    <h2>Muestra de filas (05/2026)</h2>
    ${tabla(['id', 'nombre', 'clase SCIAN', 'actividad', 'personal', 'colonia', 'alcaldía', 'CP', 'latitud', 'longitud', 'alta'], D.denue_filas.map(r => [r.id, r.nom_estab, r.codigo_act, r.nombre_act, r.per_ocu, r.nomb_asent, r.municipio, r.cod_postal, r.latitud, r.longitud, r.fecha_alta]))}`,

  'Colonias': () => `
    <h2>Catálogo de colonias</h2>
    <p class="nota">${fmt(D.col_total)} polígonos. Primeros ${D.col_tabla.length}:</p>
    ${tabla(['clave', 'colonia', 'alcaldía', 'clasificación'], D.col_tabla)}
    <h2>Mercados públicos</h2>
    ${tabla(['Mercado', 'Tipo', 'Locales', 'Longitud', 'Latitud'], D.mercados.slice(0, 40).map(m => [m[2], m[3], m[4], m[0], m[1]]))}
    <p class="nota">Primeros 40 de ${D.mercados.length}.</p>`,

  'Censo': () => `
    <div class="cards">
      <div class="card"><b>${fmt(D.ce_total.ue)}</b><span>unidades económicas en CDMX (2023)</span></div>
      <div class="card"><b>${fmt(D.ce_total.po)}</b><span>personas ocupadas</span></div>
    </div>
    <h2>Unidades económicas por sector</h2>
    ${barras(D.ce_sector.map(s => [s[0] + ' ' + s[1], s[2], s[1]]), 'var(--c2)')}
    <h2>Por alcaldía</h2>
    ${barras(Object.entries(D.ce_alcaldia).sort((a, b) => b[1][0] - a[1][0]).map(([k, v]) => [k, v[0]]), 'var(--c1)')}
    <h2>Muestra de filas</h2>
    <p class="nota">Cada fila es alcaldía × actividad × estrato. Estrato vacío = suma; 99 = confidencial. Las cifras en millones de pesos.</p>
    ${tabla(['alcaldía', 'sector', 'subsector', 'rama', 'código', 'estrato', 'UE', 'personal ocupado', 'valor agregado', 'ingresos'], D.ce_muestra.map(r => [r.E04, r.SECTOR, r.SUBSECTOR, r.RAMA, r.CODIGO, r.ID_ESTRATO, r.UE, r.H001A, r.A131A, r.A800A]))}`,

  'Calles': () => `
    <div class="cards">
      <div class="card"><b>${fmt(D.osm.ways)}</b><span>calles únicas (${D.osm.mosaicos} de 16 mosaicos, ${D.osm.mb} MB)</span></div>
      <div class="card"><b>${D.osm.ways ? Math.round(100 * D.osm.con_nombre / D.osm.ways) : 0} %</b><span>con nombre</span></div>
    </div>
    <h2>Por tipo de vía</h2>
    ${barras(Object.entries(D.osm.tipos).sort((a, b) => b[1] - a[1]), 'var(--c3)')}
    <h2>Muestra</h2>
    ${tabla(['osm_id', 'tipo', 'nombre', 'sentido único', 'velocidad máx.', 'puntos', 'otras etiquetas'], D.osm_muestra.map(w => [w.osm_id, w.highway, w.name, w.oneway, w.maxspeed, w.puntos, w.otras_etiquetas]), [5, 6])}`,

  'Otros': () => `<h2>Archivos sueltos en externas/</h2>${tabla(['Archivo', 'MB'], D.otros, [1])}`,
};

const nav = document.getElementById('tabs'), main = document.getElementById('main');
Object.keys(secciones).forEach((k, i) => {
  const b = document.createElement('button'); b.textContent = k; b.onclick = () => ir(k); nav.appendChild(b);
});
function ir(k) {
  [...nav.children].forEach(b => b.classList.toggle('on', b.textContent === k));
  main.innerHTML = secciones[k]();
  if (k === 'Mapa') iniciarMapa();
  try { location.hash = k; } catch (e) {}
}

function iniciarMapa() {
  const cv = document.getElementById('mapa'), ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  const lat0 = 19.32, k = Math.cos(lat0 * Math.PI / 180);
  const X = lon => (lon + 99.14) * k, Y = lat => lat - lat0;
  let esc0 = Math.min(W / (0.43 * k), H / 0.56) * 0.95, tx = W / 2, ty = H / 2;
  const capas = { 'Colonias': true, 'Calles': true, 'DENUE (muestra)': true, 'Mercados': true };
  const col = { 'Colonias': '#8a8a80', 'Calles': '#b7b3a6', 'DENUE (muestra)': '#2b6cb0', 'Mercados': '#c53030' };
  const tog = document.getElementById('tog');
  Object.keys(capas).forEach(n => {
    const l = document.createElement('label');
    l.innerHTML = `<input type="checkbox" checked><span class="dot" style="background:${col[n]}"></span>${n}`;
    l.firstChild.onchange = e => { capas[n] = e.target.checked; dibujar(); }; tog.appendChild(l);
  });
  const sx = lon => tx + X(lon) * esc0, sy = lat => ty - Y(lat) * esc0;
  function dibujar() {
    ctx.clearRect(0, 0, W, H);
    if (capas['Colonias']) { ctx.strokeStyle = col['Colonias']; ctx.globalAlpha = .55; ctx.lineWidth = .6;
      D.col_geom.forEach(a => { ctx.beginPath(); a.forEach((p, i) => i ? ctx.lineTo(sx(p[0]), sy(p[1])) : ctx.moveTo(sx(p[0]), sy(p[1]))); ctx.closePath(); ctx.stroke(); }); }
    if (capas['Calles']) { ctx.globalAlpha = .8;
      D.calles.forEach(([g, a]) => { ctx.strokeStyle = g ? '#8f8a78' : '#cfcbbd'; ctx.lineWidth = g ? 1.1 : .4;
        ctx.beginPath(); a.forEach((p, i) => i ? ctx.lineTo(sx(p[0]), sy(p[1])) : ctx.moveTo(sx(p[0]), sy(p[1]))); ctx.stroke(); }); }
    if (capas['DENUE (muestra)']) { ctx.globalAlpha = .5; ctx.fillStyle = col['DENUE (muestra)'];
      D.denue_puntos.forEach(p => ctx.fillRect(sx(p[0]) - .7, sy(p[1]) - .7, 1.5, 1.5)); }
    if (capas['Mercados']) { ctx.globalAlpha = 1; ctx.fillStyle = col['Mercados'];
      D.mercados.forEach(m => { ctx.beginPath(); ctx.arc(sx(m[0]), sy(m[1]), 3, 0, 7); ctx.fill(); }); }
    ctx.globalAlpha = 1;
  }
  let drag = null;
  cv.onmousedown = e => drag = [e.clientX, e.clientY, tx, ty];
  window.onmouseup = () => drag = null;
  cv.onmousemove = e => {
    if (drag) { tx = drag[2] + e.clientX - drag[0]; ty = drag[3] + e.clientY - drag[1]; dibujar(); return; }
    const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    const m = capas['Mercados'] && D.mercados.find(m => Math.hypot(sx(m[0]) - mx, sy(m[1]) - my) < 6);
    document.getElementById('info').textContent = m ? `${m[2]} · ${m[3]} · ${m[4]} locales` : 'Rueda para acercar, arrastrar para mover. Pasa el cursor sobre un mercado para ver su nombre.';
  };
  cv.onwheel = e => { e.preventDefault(); const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    const f = e.deltaY < 0 ? 1.25 : 0.8; tx = mx - (mx - tx) * f; ty = my - (my - ty) * f; esc0 *= f; dibujar(); };
  dibujar();
}
ir(location.hash.slice(1) in secciones ? decodeURIComponent(location.hash.slice(1)) : 'Resumen');
</script>
</body>
</html>
