<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pulso DENUE CDMX — Prototipo 2</title>
<style>
  :root { --tenue:var(--texto-tenue); }
  html,body { margin:0; height:100%; background:var(--fondo); color:var(--texto);
    font:13px/1.35 system-ui,sans-serif; overflow:hidden; overscroll-behavior:none; touch-action:none; }
  canvas { display:block; position:fixed; inset:0; width:100%; height:100%; }
  #titulo { position:fixed; left:16px; top:14px; pointer-events:none; text-shadow:0 0 12px #000; }
  #titulo b { font-size:15px; letter-spacing:.02em; }
  #titulo span { display:block; color:var(--tenue); font-size:12px; }
  #leyenda { position:fixed; left:12px; bottom:calc(12px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:2px; }
  #leyenda button { all:unset; cursor:pointer; padding:5px 8px; border-radius:6px; background:#0b0e18cc; display:flex; gap:8px; align-items:center; font-size:12px; }
  #leyenda button[aria-pressed=false] { opacity:.35; }
  #leyenda i { width:10px; height:10px; border-radius:50%; display:inline-block; }
  #hud { position:fixed; right:10px; top:10px; background:#0b0e18d9; padding:8px 10px; border-radius:8px; font:11px/1.4 ui-monospace,monospace; min-width:176px; }
  #hud div { display:flex; justify-content:space-between; gap:12px; } #hud em { color:var(--tenue); font-style:normal; }
  #acciones { position:fixed; right:10px; bottom:calc(12px + env(safe-area-inset-bottom)); display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; max-width:60vw; }
  #acciones button { all:unset; cursor:pointer; padding:7px 10px; border-radius:6px; background:#1a2038; font-size:12px; }
  #resultado { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); background:#0b0e18f0; padding:14px 16px; border-radius:10px; font:12px/1.5 ui-monospace,monospace; display:none; white-space:pre; }
  #corte { position:fixed; left:16px; top:58px; color:var(--tenue); font-size:12px; pointer-events:none; }
</style>
</head>
<body>
<div id="titulo"><b>Pulso DENUE CDMX</b><span>Prototipo 2 · renderizador sin mapa base</span></div>
<div id="corte"></div>
<div id="hud"></div>
<div id="leyenda"></div>
<div id="acciones">
  <button id="b-despertar">Despertar</button>
  <button id="b-bloom">Brillo</button>
  <button id="b-bench">Benchmark 12 s</button>
</div>
<div id="resultado"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
